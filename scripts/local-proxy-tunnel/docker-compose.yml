services:
  proxy:
    image: nginx:alpine
    container_name: rutube_proxy
    restart: unless-stopped
    ports:
      # 8889: хост-порт для локальных тестов. 8888 занят kino-club-nginx-proxy
      # (SSRF-gateway private-cinema, listen 127.0.0.1:8888 с 2026-08-28) —
      # ngrok ходит на proxy:80 по внутренней сети, хост-порт ему не нужен.
      - "8889:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    cap_add:
      - NET_ADMIN
    command: sh -c "ip route del default && ip route add default via ${GATEWAY:-192.168.1.1} dev eth1 && nginx -g 'daemon off;'"
    networks:
      default:
      physical_net:
        ipv4_address: ${PROXY_IP:-192.168.1.199}

  ngrok:
    image: ngrok/ngrok:latest
    container_name: rutube_ngrok
    restart: unless-stopped
    depends_on:
      - proxy
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN:-}
    command: "http proxy:80 --log=stdout"
    networks:
      - default

  socks5:
    build:
      context: .
      dockerfile: Dockerfile.socks5
    image: ruzone_proxy
    container_name: ruzone_proxy
    restart: unless-stopped
    ports:
      - "1080:1080"
    cap_add:
      - NET_ADMIN
    command: sh -c "while ! ip link show eth1 >/dev/null 2>&1; do sleep 1; done; ip route del default && ip route add default via ${GATEWAY:-192.168.1.1} dev eth1 && socks5"
    networks:
      default:
      physical_net:
        ipv4_address: ${SOCKS5_IP:-192.168.1.198}

networks:
  default:
  physical_net:
    driver: ipvlan
    driver_opts:
      parent: ${PARENT_INTERFACE:-wlp44s0}
      ipvlan_mode: l2
    ipam:
      config:
        - subnet: ${SUBNET:-192.168.1.0/24}
          gateway: ${GATEWAY:-192.168.1.1}


