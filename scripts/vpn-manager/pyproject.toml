[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vpn-manager"
version = "0.1.0"
description = "Client-side VPN protocol manager (Xray Reality/XHTTP, Hysteria2)"
requires-python = ">=3.10"
dependencies = ["typer>=0.9"]

[project.scripts]
vpn = "vpnm.cli:app"

[tool.setuptools]
packages = ["vpnm"]
